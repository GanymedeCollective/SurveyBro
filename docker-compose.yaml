services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: CHANGE_ME
      MONGODB_URI: mongodb://mongo:27017
      TZ: UTC # Europe/Paris
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  data:
    name: survey-bro-data
